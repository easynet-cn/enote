[workspace]
members = ["src-tauri", "crates/enote-mcp"]
resolver = "2"

[workspace.package]
version = "1.2.9"
edition = "2024"
authors = ["124244236@qq.com"]

[workspace.dependencies]
# Tauri（tray-icon 由子 crate 的 desktop feature 控制）
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-build = { version = "2.6", features = [] }
tauri-plugin-fs = "2.5"
tauri-plugin-opener = "2.5"
tauri-plugin-shell = "2.3"
tauri-plugin-dialog = "2.7"
tauri-plugin-updater = "2.10"
tauri-plugin-process = "2.3"
tauri-plugin-os = "2.3"

# Serde
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.22"
yaml_serde = "0.10"

# Database（基础仅 SQLite，MySQL/PG 由 desktop feature 启用）
sea-orm = { version = "2.0", features = ["sqlx-sqlite", "runtime-tokio"] }
sea-orm-migration = { version = "2.0", features = ["runtime-tokio", "sqlx-sqlite"] }

# Async
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "io-util", "fs"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# CLI
clap = { version = "4.6.6", features = ["derive"] }

# Crypto
aes-gcm = "0.11"
argon2 = "0.5"
sha2 = "0.11"
rand = "0.10"
base64 = "0.23"

# Data formats
rust_xlsxwriter = "0.97"
calamine = "0.36"
csv = "1.4"
zip = "8.6"

# Utilities
chrono = "0.4"
config = "0.15"
uuid = { version = "1.24", features = ["v4"] }
sys-locale = "0.3"
keyring = { version = "4.1", features = ["apple-native-keyring-store", "windows-native-keyring-store", "dbus-secret-service-keyring-store"] }

# HTTP Client
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls", "form"] }

# Cloud Storage
opendal = { version = "0.58", features = ["services-s3", "services-oss", "services-cos", "services-webdav"] }

# MCP
rmcp = { version = "3.1", features = ["server", "transport-io"] }
schemars = "1.2"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
